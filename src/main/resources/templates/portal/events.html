<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Browse Events</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/portal-nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-group">
            <h1>Browse Events</h1>
            <p class="page-subtitle">Explore all available competitions, hackathons, and technical tracks</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="card">
        <div class="card-body" style="text-align:center; padding: 3rem 1.5rem;">
            <p style="color: var(--text-muted);">No events published yet. Check back soon!</p>
        </div>
    </div>

    <div class="cards-grid" th:if="${!#lists.isEmpty(events)}">
        <div class="card event-card" th:each="event : ${events}">
            <div class="card-body">
                <div class="event-category" th:text="${event.category}">Hackathon</div>
                <h3 class="event-name" th:text="${event.name}">Event Title</h3>
                <p class="event-desc" th:text="${event.description}">Event description text here...</p>
                <div class="event-meta">
                    <div>
                        <strong style="color:var(--text-primary);">Venue:</strong> <span th:text="${event.venue}">Auditorium</span>
                    </div>
                    <div>
                        <strong style="color:var(--text-primary);">Time:</strong>
                        <span th:text="${#temporals.format(event.startTime, 'MMM dd, HH:mm')} + ' - ' + ${#temporals.format(event.endTime, 'HH:mm')}">Date & Time</span>
                    </div>
                </div>
                <div class="event-footer" style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="badge badge-primary">Max <span th:text="${event.maxTeamSize}">4</span> Members</span>
                    <a th:href="@{/portal/team/new}" class="btn btn-secondary btn-sm">Register Team</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
