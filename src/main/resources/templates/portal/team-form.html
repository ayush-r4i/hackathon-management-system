<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - College Fest Manager'">Register Team</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/portal-nav :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <div class="page-title-group">
            <h1>Register Team</h1>
            <p class="page-subtitle">Form a team to compete in festival events. You will be registered as team leader.</p>
        </div>
        <a th:href="@{/portal/dashboard}" class="btn btn-secondary">Cancel</a>
    </div>

    <div class="alert alert-error" th:if="${error}">
        <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span th:text="${error}">Error message</span>
    </div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="card-body">
            <form th:action="@{/portal/team/register}" method="post">
                <div class="form-group">
                    <label for="teamName">Team Name *</label>
                    <input type="text" id="teamName" name="teamName" placeholder="e.g. Code Wizards" required autofocus>
                </div>

                <div class="form-group">
                    <label for="eventId">Select Event *</label>
                    <select id="eventId" name="eventId" class="form-select" required>
                        <option value="">— Choose an Event —</option>
                        <option th:each="ev : ${events}" th:value="${ev.id}"
                                th:text="${ev.name} + ' (' + ${ev.category} + ' - Max ' + ${ev.maxTeamSize} + ' members)'">
                            Event Title
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Team Leader (You)</label>
                    <input type="text" th:value="${participant.name} + ' (' + (${participant.email != null ? participant.email : 'No email'}) + ')'" disabled
                           style="background:#F8FAFC; color:var(--text-muted);">
                    <small style="color:var(--text-muted); display:block; margin-top:0.25rem;">
                        You will automatically be registered as Participant #1 for this team.
                    </small>
                </div>

                <div style="display:flex; gap:0.75rem; justify-content:flex-end; margin-top:1.5rem;">
                    <a th:href="@{/portal/dashboard}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn">Register Team</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
